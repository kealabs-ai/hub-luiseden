      - "traefik.http.routers.eden-vendas.entrypoints=https"
      - "traefik.http.routers.eden-vendas.tls=true"
      - "traefik.http.routers.eden-vendas.service=eden-vendas"
      - "traefik.http.services.eden-vendas.loadbalancer.server.port=8000"
