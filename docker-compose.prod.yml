version: '3.8'

networks:
  easypanel:
    external: true
  eden-internal:
    driver: bridge

x-healthcheck: &default-healthcheck
  test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

x-common: &common
  environment:
    - SECRET_KEY=${SECRET_KEY}
    - luis_ed_DB_HOST=${luis_ed_DB_HOST}
    - luis_ed_DB_PORT=${luis_ed_DB_PORT}
    - luis_ed_DB_NAME=${luis_ed_DB_NAME}
    - luis_ed_DB_USER=${luis_ed_DB_USER}
    - luis_ed_DB_PASSWORD=${luis_ed_DB_PASSWORD}
  networks:
    - easypanel
    - eden-internal
  restart: unless-stopped

services:
  eden-svc-auth:
    <<: *common
    build: ./svc-auth
    image: luiseden/svc-auth:latest
    healthcheck: *default-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.eden-auth.rule=Host(`srv1023256.hstgr.cloud`) && PathPrefix(`/v1/eden/auth`)"
      - "traefik.http.routers.eden-auth.entrypoints=https"
      - "traefik.http.routers.eden-auth.tls=true"
      - "traefik.http.routers.eden-auth.service=eden-auth"
      - "traefik.http.services.eden-auth.loadbalancer.server.port=8000"
      - "traefik.http.routers.eden-auth.middlewares=eden-cors"
      - "traefik.http.routers.eden-auth.priority=100"
      - "traefik.http.middlewares.eden-cors.headers.accesscontrolalloworiginlist=https://srv1023256.hstgr.cloud,https://peru-lemur-870410.hostingersite.com,http://localhost:5173"
      - "traefik.http.middlewares.eden-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.eden-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.eden-cors.headers.accesscontrolallowcredentials=true"

  eden-svc-catalogo:
    <<: *common
    build: ./svc-catalogo
    image: luiseden/svc-catalogo:latest
    healthcheck: *default-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.eden-catalogo.rule=Host(`srv1023256.hstgr.cloud`) && PathPrefix(`/v1/eden/catalogo`)"
      - "traefik.http.routers.eden-catalogo.entrypoints=https"
      - "traefik.http.routers.eden-catalogo.tls=true"
      - "traefik.http.routers.eden-catalogo.service=eden-catalogo"
      - "traefik.http.services.eden-catalogo.loadbalancer.server.port=8000"
      - "traefik.http.routers.eden-catalogo.middlewares=eden-cors"
      - "traefik.http.routers.eden-catalogo.priority=100"

  eden-svc-vendas:
    <<: *common
    build: ./svc-vendas
    image: luiseden/svc-vendas:latest
    healthcheck: *default-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
