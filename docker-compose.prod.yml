      - "traefik.http.routers.eden-manutencao.entrypoints=https"
      - "traefik.http.routers.eden-manutencao.tls=true"
      - "traefik.http.routers.eden-manutencao.service=eden-manutencao"
      - "traefik.http.services.eden-manutencao.loadbalancer.server.port=8000"
