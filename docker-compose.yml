version: '3.8'

services:

  hubluiseden:
    build: .
    container_name: hubluiseden
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - eden-net

