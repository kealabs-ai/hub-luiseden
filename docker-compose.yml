version: '3.8'

services:

  hubluiseden:
    build: .
    container_name: hubluiseden
    ports:
      - "9000:8000"
    environment:
      - luis_ed_DB_HOST=${luis_ed_DB_HOST}
      - luis_ed_DB_PORT=${luis_ed_DB_PORT}
      - luis_ed_DB_NAME=${luis_ed_DB_NAME}
      - luis_ed_DB_USER=${luis_ed_DB_USER}
      - luis_ed_DB_PASSWORD=${luis_ed_DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hubluiseden.rule=Host(`srv1023256.hstgr.cloud`) && PathPrefix(`/`)"
      - "traefik.http.routers.hubluiseden.entrypoints=https"
      - "traefik.http.routers.hubluiseden.tls=true"
      - "traefik.http.routers.hubluiseden.service=hubluiseden"
      - "traefik.http.services.hubluiseden.loadbalancer.server.port=8000"
      - "traefik.http.routers.hubluiseden.middlewares=hubluiseden-cors"
      - "traefik.http.middlewares.hubluiseden-cors.headers.accesscontrolalloworiginlist=https://srv1023256.hstgr.cloud"
      - "traefik.http.middlewares.hubluiseden-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.hubluiseden-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.hubluiseden-cors.headers.accesscontrolallowcredentials=true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - eden-net

